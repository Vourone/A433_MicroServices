# Menggunakan Docker Compose versi 2 atau lebih.
version: '2.0.0'

# Memiliki dua buah service: item-app dan item-db.
services:
  # Service untuk item-app
  item-app:
    image: ghcr.io/vourone/item-app:v1  # Menggunakan image item-app.
    ports:
      - "80:8080"  # Melakukan port mapping agar dapat diakses dari port 80 di host.
    depends_on:
      - item-db  # Pastikan item-app hanya berjalan setelah item-db diluncurkan.
    restart: always  # Menerapkan restart policy agar container selalu restart ketika terhenti.
    volumes:
      - ./logs:/app/logs  # Menyertakan berkas log.txt yang berisi logs ketika menggunakan Docker Compose.

  # Service untuk item-db
  item-db:
    image: mongo:3  # Menggunakan image mongo:3
    volumes:
      - app-db:/data/db  # Memakai volume bernama app-db dengan target /data/db di container.
    restart: always  # Menerapkan restart policy agar container selalu restart ketika terhenti.

# Memiliki satu buah volume bernama app-db.
volumes:
  app-db:
